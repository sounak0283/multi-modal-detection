[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perimeter"
version = "0.1.0"
description = "Fire, smoke and boundary detection for fixed-mount cameras"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Runtime dependencies. Every entry must have a row in NOTICE.md section 3.
# Permissive licences only - see NOTICE.md for the policy and the CI gate.
dependencies = [
    "numpy>=2.0,<3",          # BSD-3-Clause
    "opencv-python>=4.10,<5", # Apache-2.0  (pinned below 5.x until 5.x is validated)
    "onnxruntime>=1.22,<2",   # MIT
    "shapely>=2.0,<3",        # BSD-3-Clause
    "supervision>=0.26,<1",   # MIT   (Detections container; NOT its deprecated ByteTrack)
    "trackers>=2.0,<3",       # Apache-2.0  clean-room ByteTrack, see NOTICE.md
    "scipy>=1.13,<2",         # BSD-3-Clause (via trackers: Hungarian assignment)
    "fastapi>=0.115,<1",      # MIT
    "uvicorn>=0.30,<1",       # BSD-3-Clause
    "pydantic>=2.7,<3",       # MIT
    "requests>=2.32,<3",      # Apache-2.0
    "PyYAML>=6.0,<7",         # MIT
    "python-dotenv>=1.0,<2",  # BSD-3-Clause  secrets out of the repo
    # MongoDB Atlas driver (Expansion Plan Phase A.1), replacing pg8000/PostgreSQL.
    "pymongo>=4.8,<5",        # Apache-2.0
    # Auth (Expansion Plan Phase B).
    "bcrypt>=4.0,<5",         # Apache-2.0  password hashing
    "itsdangerous>=2.1,<3",   # BSD-3-Clause  signed session cookies
    # Face-embedding vector index (Expansion Plan Phase F redesign): nearest-neighbour
    # match across every enrolled pose, on-disk so the index survives a restart.
    "chromadb>=1.0,<2",       # Apache-2.0
]

[project.optional-dependencies]
# Never shipped to customers. See NOTICE.md section 4.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pip-licenses>=5.0",
    "mongomock>=4.1,<5",      # BSD-3-Clause  in-memory MongoDB for tests, no live server needed
]

[project.scripts]
perimeter-record = "perimeter.record:main"
perimeter-dashboard = "perimeter.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own idiom for a request-scoped dependency IS `Depends(...)` as an argument
# default (api/app.py's auth routes, Expansion Plan Phase B) - B008 exists to catch
# accidental mutable-default bugs, not this pattern, so it is allow-listed rather than
# routing auth through a different style than the rest of FastAPI's ecosystem uses.
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
