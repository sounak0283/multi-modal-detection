# Engineering constants: how the algorithm behaves.
#
# This file is COMMITTED, because these are decisions worth reviewing and worth having
# in git history - a changed threshold should be visible in a diff.
#
# What does NOT belong here: anything specific to one deployment. Camera source,
# credentials, resolution, decode rate and autostart are per-install facts and live in
# .env (git-ignored). Putting them here would mean the repository carried one site's
# wiring, and every install would conflict on this file.
#
# Zone definitions are also per-deployment and live in config/zones.yaml, git-ignored,
# with config/zones.example.yaml committed as the reference.

inference:
  # Cadences are frame counters, deliberately offset so the two models never run on
  # the same frame (PLAN.md section 4).
  person_every_n: 2
  firesmoke_every_n: 8
  firesmoke_offset: 3
  # PPE (Expansion Plan Phase H) runs every Nth DETECTION frame - it needs tracked
  # person boxes, which only exist on detection frames, so no offset is needed the way
  # fire/smoke's raw-camera-frame cadence has one (see settings.py's InferenceSettings).
  ppe_every_n: 3
  input_size: 416
  # Set from the Phase 1 benchmark, not by assumption (PLAN.md section 9.2).
  precision: fp32 # fp32 | fp16 | int8
  intra_op_threads: null # null = physical_cores - 1

firesmoke:
  # Raised from 0.45 (2026-09-18): the shipped checkpoint is trained on D-Fire alone with
  # no indoor site negatives yet (see models/firesmoke/manifest.json's own
  # validation_status) - it was misreading this office's overhead lighting/hazy ceiling
  # as smoke. This is a stopgap that trades recall for fewer false alarms until real site
  # negatives are collected and the model is retrained/re-evaluated per PLAN.md section 5.2.
  conf_fire: 0.70
  # Lower than fire: indoors, smoke reaches the camera first (PLAN.md section 5.4).
  # Raised from 0.35 for the same reason as conf_fire above - this was the class actually
  # false-triggering on bright ceiling panels.
  conf_smoke: 0.70
  # K-of-N temporal gate. At firesmoke_every_n=8 this is a ~5 s window, ~3 s minimum
  # latency to alert. Shrinking it is how false alarms are made.
  gate_k: 6
  gate_n: 10
  gate_iou: 0.3

boundary:
  # Hysteresis in *detection frames*, which run at ~6-8 Hz, not at frame rate.
  # 4 frames is therefore ~0.5-0.7 s (PLAN.md section 6.3).
  default_min_frames: 4
  # Lowered from the tracker's own default of 0.50 (2026-09-22): on a backlit scene
  # (bright window behind seated people), measured detection scores oscillated between
  # ~0.17 and ~0.63 for people plainly sitting still on camera - many real detections
  # landed between this and person_conf (0.30), so tracks kept starting and dying
  # instead of confirming, and occupancy/entry never fired. 0.40 catches those without
  # admitting the lowest-confidence noise (~0.17-0.28 in the same measurement).
  track_activation_threshold: 0.40

crowd:
  # DBSCAN over person foot points (Expansion Plan Phase G) - no model. eps_px is the
  # neighbour radius in pixels; deliberately generous since perspective spreads a
  # near-camera person's foot point further from their neighbours than a far-camera
  # person's, for the same real-world distance.
  eps_px: 80.0
  min_samples: 2

identity:
  # Default OFF. Biometric processing requires a consent story per deployment
  # (PLAN.md section 10.3). The rest of the product works without it.
  # Enabled here for local dev testing only.
  enabled: true
  min_person_box_px: 120
  # Raised from 0.363 (OpenCV's benchmark-tuned default) on 2026-09-21 after a real false
  # match: a stranger in a grey hoodie was labelled as an enrolled person. A stopgap - the
  # right value should come from the identity_confidence scores now recorded per match
  # (Recognition Log page). A higher bar turns wrong names into "unrecognised", the safer
  # failure direction (PLAN.md section 7).
  cosine_threshold: 0.55
  # Chroma's on-disk nearest-neighbour index (one vector per enrolled pose). Relative
  # to the backend root, already covered by the backend/data/** gitignore rule.
  gallery_dir: data/identity_gallery

storage:
  # MongoDB. The connection URL contains a password and is a per-deployment fact,
  # so it lives in .env as PERIMETER_MONGO_URL. Only the policy lives here.
  #
  # Retention is a stated, enforced obligation rather than a preference
  # (PLAN.md section 10.3) - especially once the identity layer ships, since alert
  # snapshots of identified people are personal data.
  retention_days: 30
  # Evidence capture (Expansion Plan Phase C). The ring buffer holds this many seconds
  # of JPEG frames per camera; on an alert, the writer waits post_roll_seconds so the
  # buffer accumulates some "after" footage too, then muxes whatever is in the buffer
  # into a clip - so ring_buffer_seconds should stay comfortably above post_roll_seconds.
  ring_buffer_seconds: 10
  # A clip is 10s in total: what the camera saw just BEFORE the alert plus post_roll_seconds
  # AFTER it (10 - 3 = 7s before, 3s after). Never shorter than min_clip_seconds: if an alert
  # arrives before that much has been recorded (right after a start or a camera reconnect)
  # the clip waits for more footage. Urgent alerts skip that wait.
  post_roll_seconds: 3
  urgent_post_roll_seconds: 1
  min_clip_seconds: 10
  # WHICH alerts get a video clip. The camera buffers continuously; a clip is cut only when
  # an alert is recorded and its rule below says so. Alerts and emails happen either way -
  # this only decides whether a video is attached.
  #   boundary_entry / boundary_exit:  all | unregistered | off
  #       "unregistered" = record unless the person was recognised as an enrolled person, so a
  #       registered person walking in is not recorded but a stranger (or an unreadable face)
  #       is. Exits are off by default: the entry already has the footage.
  #   crowd / fire / smoke / access / ppe:  on | off
  clip_triggers:
    boundary_entry: unregistered
    boundary_exit: off
    crowd: on
    fire: on
    smoke: on
    access: on
    ppe: on
    welding: on
  # Urgent alerts are emailed IMMEDIATELY (the video follows as a second "VIDEO READY" email)
  # and are processed on their own worker, so they never wait behind a slow upload.
  urgent_kinds: [fire, smoke, crowd, access]
  evidence_root: data/evidence
  snapshot_dir: snapshots
  clip_dir: clips
  # Where evidence lives: "local" (disk under evidence_root) or "s3". For s3 set
  # PERIMETER_S3_BUCKET / PERIMETER_S3_REGION in .env and AWS credentials the usual boto3
  # way (env vars, or an IAM role when running on AWS). A bad or missing S3 setup falls
  # back to local disk with an error in the log rather than losing evidence.
  backend: s3
  s3_prefix: ""
  # How long the video link in an alert email keeps working. S3 allows at most 168 (7 days).
  # The link is a bearer token: anyone holding the email can open the video until it expires.
  s3_link_expiry_hours: 72
  # Attempts to upload one clip (backoff 5s, 30s, 120s between them). If all fail the alert
  # email has already gone out without a link; the event is marked clip_status=failed.
  s3_upload_attempts: 4

# Dashboard sections that can be switched off. This is only the DEFAULT: an admin flips it from
# the dashboard's Settings page and that choice is stored in MongoDB and wins over this file.
features:
  video_test: true

# The dashboard's "Video test" page: play an uploaded video through the real detection code.
test_video:
  directory: data/test_videos # relative to backend/; already covered by the data/** gitignore
  max_upload_mb: 2048
  retention_days: 7 # uploaded videos older than this are deleted automatically

health:
  feed_lost_after_s: 10
  lens_obscured_after_s: 30

# Alert routing rules (which severities go where, how often, who to) are dashboard-
# managed since Expansion Plan Phase D - see the Alerts page, backed by MongoDB's
# alert_config collection - not a file here. SMTP credentials
# (PERIMETER_SMTP_HOST/PORT/USER/PASSWORD/FROM) still live in .env, a per-deployment fact.
