[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fsbd"
version = "0.1.0"
description = "Fire, smoke and boundary detection for fixed-mount cameras"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Runtime dependencies. Every entry must have a row in NOTICE.md section 3.
# Permissive licences only - see NOTICE.md for the policy and the CI gate.
dependencies = [
    "numpy>=2.0,<3",          # BSD-3-Clause
    "opencv-python>=4.10,<5", # Apache-2.0  (pinned below 5.x until 5.x is validated)
    "onnxruntime>=1.22,<2",   # MIT
    "shapely>=2.0,<3",        # BSD-3-Clause
    "supervision>=0.26,<1",   # MIT   (Detections container; NOT its deprecated ByteTrack)
    "trackers>=2.0,<3",       # Apache-2.0  clean-room ByteTrack, see NOTICE.md
    "scipy>=1.13,<2",         # BSD-3-Clause (via trackers: Hungarian assignment)
    "fastapi>=0.115,<1",      # MIT
    "uvicorn>=0.30,<1",       # BSD-3-Clause
    "pydantic>=2.7,<3",       # MIT
    "requests>=2.32,<3",      # Apache-2.0
    "PyYAML>=6.0,<7",         # MIT
    "python-dotenv>=1.0,<2",  # BSD-3-Clause  secrets out of the repo
    # pg8000, NOT psycopg. psycopg2 is LGPL-with-exceptions and psycopg3 is LGPL-3.0;
    # both would fail this project's own licence gate. See NOTICE.md section 3.
    "pg8000>=1.31,<2",        # BSD-3-Clause  pure-Python PostgreSQL driver
]

[project.optional-dependencies]
# Never shipped to customers. See NOTICE.md section 4.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pip-licenses>=5.0",
]

[project.scripts]
fsbd-record = "fsbd.record:main"
fsbd-dashboard = "fsbd.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
